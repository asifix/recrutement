<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Admin - Umoja Wetu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="nav-container">
                <div class="logo-container">
                    <div class="logo-icon">🤝</div>
                    <h1 class="logo">Umoja Wetu</h1>
                </div>
                <div class="nav-links">
                    <a href="/index.html">Accueil</a>
                    <a href="/apply.html">Postuler</a>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section class="login-section">
            <div class="container">
                <div class="login-card">
                    <div class="logo-container" style="justify-content: center; margin-bottom: 2rem;">
                        <div class="logo-icon">🤝</div>
                        <h1 class="logo">Umoja Wetu</h1>
                    </div>
                    <h2>Connexion Administrateur</h2>
                    <p>Accédez au tableau de bord de gestion des candidatures</p>

                    <form id="loginForm" class="login-form">
                        <div class="form-group">
                            <label for="username">Nom d'utilisateur</label>
                            <input type="text" id="username" name="username" required>
                        </div>

                        <div class="form-group">
                            <label for="password">Mot de passe</label>
                            <input type="password" id="password" name="password" required>
                        </div>

                        <button type="submit" class="btn-primary large">Se connecter</button>
                    </form>

                    <div id="errorMessage" class="error-message" style="display: none;">
                        <p>Identifiants incorrects. Veuillez réessayer.</p>
                    </div>

                    <div class="login-footer">
                        <a href="/index.html">← Retour à l'accueil</a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
